[package]
name = "office"
version = "0.1.0"
edition = "2021"
description = "Circuit Story : le moteur du jeu (bureau d'études électronique) et son serveur local, portage de serveur.py et de moteur/"

[lib]
doctest = false

[dependencies]
indexmap = "2"   # les dict de Python : l'ordre d'insertion est gardé
# float_roundtrip : un flottant relu est, au bit près, celui qui a été écrit (les sauvegardes se relisent à l'identique)
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] } # la date d'un record (déjà tirée par la caisse commune)
ctrlc = { version = "3", features = ["termination"] } # Ctrl+C et SIGTERM (arrêt par web_launcher) : la partie est sauvegardée avant de sortir
# Serveur HTTP/HTTPS et appairage : communs aux web tools (dépôt web_suite)
web_tools_commun = { git = "https://github.com/pilou33620/web_suite", rev = "bc1f42ca77df7ccfc415a93018640058c82e2efe" }
