name: bancs d'essai

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  essais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # le moteur (tests Python réécrits, parties comparées au moteur Python) et le serveur (fichiers, Host, CSRF, tailles)
      - name: Moteur et serveur (Rust)
        run: cargo test --release -p office

      # les personnages passent par les portes, sur des plans remplis par le moteur
      - name: Trajets
        run: node tests/test_trajets.js

      # l'interface : chaque fichier JavaScript doit au moins se lire
      - name: Interface (syntaxe)
        run: |
          for f in web/jeu.js web/plan.js; do node --check "$f" || exit 1; done
          node --experimental-default-type=module --check web/rendu.js
