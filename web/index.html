<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b211a">
<title>Circuit Story — bureau d'études</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="barre">
    <div id="date" class="titre-date">…</div>
    <div class="renommee" title="Renommée">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="#ffc94d" stroke="#0f130e" stroke-width="1.5" aria-hidden="true"><path d="M12 2l3 7 7 .6-5.3 4.6 1.6 7.1L12 17.5 5.7 21.3l1.6-7.1L2 9.6 9 9z"/></svg>
      <span id="rep">0</span>
    </div>
    <div class="tresorerie">
      <div class="etiquette">TRÉSORERIE</div>
      <div id="argent" class="argent">…</div>
    </div>
  </header>

  <main id="zone">
    <div id="cadre"><div id="echelle"><div id="monde"><div id="statique"></div><div id="dyn"></div><div id="persos"></div></div></div></div>

    <div class="outils">
      <button type="button" class="outil actif" aria-label="Sélection"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l14 7-6 2-2 6z" fill="currentColor"/></svg></button>
      <button type="button" class="outil" data-act="onglet" data-id="locaux" aria-label="Aménager les locaux"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h10M13 4v16"/></svg></button>
      <button type="button" class="outil" data-act="onglet" data-id="journal" aria-label="Journal"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 3h11a2 2 0 0 1 2 2v16l-4-2-4 2-4-2-3 2V5a2 2 0 0 1 2-2z"/><path d="M9 8h6M9 12h6"/></svg></button>
    </div>
    <div class="vues" id="vues"></div>
    <div class="conditions" id="conditions" hidden></div>

    <div class="hud-bas">
      <div class="ligne-hud">
        <button type="button" id="carte-projet" class="carte-projet" data-act="onglet" data-id="projets"></button>
        <div class="commandes">
          <button type="button" id="vitesse" class="rond vitesse" data-act="vitesse" aria-label="Changer la vitesse">1×</button>
          <button type="button" id="lecture" class="rond lecture" data-act="lecture" aria-label="Lecture"></button>
        </div>
      </div>
      <button type="button" id="bandeau" class="bandeau" data-act="onglet" data-id="journal"></button>
    </div>
  </main>

  <aside id="panneau" aria-label="Panneau de gestion">
    <div class="tete-panneau">
      <h2 id="titre-panneau">Projets</h2>
      <button type="button" class="fermer" data-act="onglet" data-id="accueil" aria-label="Fermer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="contenu-panneau" class="contenu-panneau"></div>
  </aside>

  <nav class="nav" aria-label="Navigation du jeu">
    <button type="button" data-act="onglet" data-id="accueil"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
    <button type="button" data-act="onglet" data-id="projets"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM8 12h8M8 16h5"/></svg>Projets</button>
    <button type="button" data-act="onglet" data-id="equipe"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.4 0 4 1.5 4.6 4.5"/></svg>Équipe</button>
    <button type="button" data-act="onglet" data-id="materiel"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></svg>Matériel</button>
    <button type="button" data-act="onglet" data-id="locaux"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 12h10M13 4v16"/></svg>Locaux</button>
  </nav>
</div>

<div id="modale" class="modale" hidden><div class="boite" role="dialog" aria-modal="true" aria-labelledby="modale-titre"><div id="modale-contenu"></div></div></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="jeu.js"></script>
</body>
</html>
